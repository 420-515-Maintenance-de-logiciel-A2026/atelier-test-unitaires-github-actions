# On commence par fournir un nom
name: Compilation du projet atelier-test-unitaires

#Le on spécifie à quel moment le worflow doit s'exécuter. Ici, on le déclenche à chaque push sur la branche main
on:
  push:
#Création de nos jobs
jobs:
  compilation: #Nom du premier job qui s'exécute sur un runner Ubuntu
    runs-on: ubuntu-latest
    #Définition des étapes du workflow
    steps:
      - name : Va chercher le code source du projet
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:                          # ...paramétrée par des entrées (`with:`)
            java-version: '25'
            distribution: 'temurin'
      - name: Ajouter droit pour la compilation
        run: chmod +x mvnw
      - name: Compile le projet
        run: ./mvnw test -Dtest=CalculatriceTest#additionnerDeuxNombresPositifs+soustraireDonneLaDifference


